name: Deploy TijdBeeld Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy current Worker source
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "5218d013ac30f1f7c006890eb67f349f"
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub repository secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
          npx --yes wrangler@4 deploy --config wrangler.jsonc
          npx --yes wrangler@4 deployments status --name tijdbeeld
