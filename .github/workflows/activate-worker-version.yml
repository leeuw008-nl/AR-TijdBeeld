name: Activate TijdBeeld Worker version

on:
  workflow_dispatch:
    inputs:
      short_version_id:
        description: "Short version ID shown in Cloudflare, e.g. 99224cad"
        required: true
        type: string

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find and activate the exact Worker version
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "5218d013ac30f1f7c006890eb67f349f"
          SHORT_VERSION_ID: ${{ inputs.short_version_id }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub repository secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
          if [[ ! "$SHORT_VERSION_ID" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo "::error::Enter the 8-character Cloudflare version prefix."
            exit 1
          fi
          npx --yes wrangler@4 versions list --name tijdbeeld --json > "$RUNNER_TEMP/versions.json"
          mapfile -t MATCHES < <(jq -r '.. | objects | to_entries[]? | select((.key == "id" or .key == "version_id") and (.value | type == "string") and (.value | startswith(env.SHORT_VERSION_ID))) | .value' "$RUNNER_TEMP/versions.json" | sort -u)
          if [ "${#MATCHES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one version matching $SHORT_VERSION_ID; found ${#MATCHES[@]}."
            jq '.. | objects | to_entries[]? | select((.key == "id" or .key == "version_id") and (.value | type == "string"))' "$RUNNER_TEMP/versions.json"
            exit 1
          fi
          VERSION_ID="${MATCHES[0]}"
          echo "Activating Worker version $VERSION_ID at 100% traffic."
          npx --yes wrangler@4 versions deploy "$VERSION_ID@100%" --name tijdbeeld --yes
          npx --yes wrangler@4 deployments status --name tijdbeeld
