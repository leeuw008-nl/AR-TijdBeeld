name: Android build

on:
  push:
    branches: [ main, feature/admin-photo-position-editor, feature/geospatial-anchor-prototype, feature/user-admin-modes, feature/ommerschans-photo-georef, fix/ommerschans-topokaart-footprint, fix/persistent-admin-session-and-inner-wall ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tijdbeeld-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore persistent diagnostic signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tijdbeeld-diagnostic-signing-key-v1

      - name: Create diagnostic signing key on first build
        run: |
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s ~/.android/debug.keystore

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Install and project georeferenced Ommerschans 1895 GLB
        run: |
          mkdir -p app/src/main/assets
          cp diversen/hoofdgebouw_ommerschans_1895.glb app/src/main/assets/ommerschans.glb
          python3 -m pip install --user pillow
          python3 scripts/render_glb_topdown.py \
            diversen/hoofdgebouw_ommerschans_1895.glb \
            app/src/main/assets/ommerschans-topdown.png \
            app/src/main/assets/ommerschans-topdown.json
          test -s app/src/main/assets/ommerschans.glb
          test -s app/src/main/assets/ommerschans-topdown.png
          test -s app/src/main/assets/ommerschans-topdown.json
          cat app/src/main/assets/ommerschans-topdown.json

      - name: Build AR-TijdBeeld APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare AR-TijdBeeld APK
        run: |
          mkdir -p dist
          APK_PATH="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::AR-TijdBeeld APK was not generated."
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          cp "$APK_PATH" dist/AR-TijdBeeld.apk
          test -s dist/AR-TijdBeeld.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs dist/AR-TijdBeeld.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging dist/AR-TijdBeeld.apk | grep -E "package: name='nl.leeuw008.tijdbeeld.diagnose32stable' versionCode='3'|application-label:'AR-TijdBeeld'"

      - name: Upload AR-TijdBeeld APK
        uses: actions/upload-artifact@v4
        with:
          name: AR-TijdBeeld
          path: dist/AR-TijdBeeld.apk
          if-no-files-found: error
          retention-days: 31


