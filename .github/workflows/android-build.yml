name: Android build

on:
  push:
    branches: [ main, feature/admin-photo-position-editor, feature/geospatial-anchor-prototype, feature/user-admin-modes, feature/ommerschans-photo-georef, fix/ommerschans-topokaart-footprint, fix/persistent-admin-session-and-inner-wall ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tijdbeeld-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare fixed Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/tijdbeeld-release.jks
            test -s app/tijdbeeld-release.jks
            echo "Fixed Android signing key prepared."
          else
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing. Refusing to build an APK with a temporary debug signing key."
            exit 1
          fi

      - name: Verify fixed Android signing key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::The keystore password or key alias secret is missing."
            exit 1
          fi
          keytool -list -keystore app/tijdbeeld-release.jks -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD > /dev/null
          ACTUAL_SHA1="$(keytool -list -v -keystore app/tijdbeeld-release.jks -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD | awk -F': ' '/SHA1:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA1="1CE60A1673FA7B5A1F5EE3D7C6DE426007806D3A"
          echo "Signing certificate SHA-1: $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::The fixed signing key does not match the original TijdBeeld SHA-1. No APK will be published."
            exit 1
          fi
          echo "Original TijdBeeld signing key verified."

      - name: Verify private key password
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::The private key password secret is missing."
            exit 1
          fi
          keytool -importkeystore -noprompt \
            -srckeystore app/tijdbeeld-release.jks \
            -srcstoretype JKS \
            -srcstorepass:env ANDROID_KEYSTORE_PASSWORD \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -srckeypass:env ANDROID_KEY_PASSWORD \
            -destkeystore "$RUNNER_TEMP/tijdbeeld-key-check.p12" \
            -deststoretype PKCS12 \
            -deststorepass:env ANDROID_KEYSTORE_PASSWORD \
            -destkeypass:env ANDROID_KEYSTORE_PASSWORD > /dev/null
          echo "Private key password verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Install and project georeferenced Ommerschans 1895 GLB
        run: |
          mkdir -p app/src/main/assets
          cp diversen/hoofdgebouw_ommerschans_1895.glb app/src/main/assets/ommerschans.glb
          python3 -m pip install --user pillow
          python3 scripts/render_glb_topdown.py \
            diversen/hoofdgebouw_ommerschans_1895.glb \
            app/src/main/assets/ommerschans-topdown.png \
            app/src/main/assets/ommerschans-topdown.json
          test -s app/src/main/assets/ommerschans.glb
          test -s app/src/main/assets/ommerschans-topdown.png
          test -s app/src/main/assets/ommerschans-topdown.json
          cat app/src/main/assets/ommerschans-topdown.json

      - name: Build AR-TijdBeeld APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare and verify AR-TijdBeeld APK
        run: |
          mkdir -p dist
          APK_PATH="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::AR-TijdBeeld APK was not generated."
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          cp "$APK_PATH" dist/AR-TijdBeeld.apk
          test -s dist/AR-TijdBeeld.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs dist/AR-TijdBeeld.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging dist/AR-TijdBeeld.apk | grep -E "package: name='nl.leeuw008.tijdbeeld' versionCode='2'"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -v 4 dist/AR-TijdBeeld.apk
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print -quit)"
          if [ -z "$APKANALYZER" ]; then
            echo "::error::apkanalyzer was not found; cannot verify Geospatial auth classes in the APK."
            exit 1
          fi
          "$APKANALYZER" dex packages dist/AR-TijdBeeld.apk > "$RUNNER_TEMP/apk-dex-packages.txt"
          if ! grep -q 'com.google.android.gms.auth' "$RUNNER_TEMP/apk-dex-packages.txt"; then
            echo "::error::The built APK does not contain com.google.android.gms.auth. Geospatial keyless authorization cannot work."
            cat "$RUNNER_TEMP/apk-dex-packages.txt"
            exit 1
          fi
          echo "Verified: com.google.android.gms.auth is present in the built APK."

      # Do not publish an APK unless Android's package installer accepts it
      # and the launcher activity starts on an Android 12 emulator.
      - name: Install and launch APK on Android 12 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 32
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r dist/AR-TijdBeeld.apk
            adb shell monkey -p nl.leeuw008.tijdbeeld 1
            sleep 8
            adb shell pidof nl.leeuw008.tijdbeeld

      - name: Upload AR-TijdBeeld APK
        uses: actions/upload-artifact@v4
        with:
          name: AR-TijdBeeld
          path: dist/AR-TijdBeeld.apk
          if-no-files-found: error
          retention-days: 31
