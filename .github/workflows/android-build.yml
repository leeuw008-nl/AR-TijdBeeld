name: Android build - full app default signing

on:
  push:
    branches: [ test/fullapp-default-signing ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Generate Ommerschans v8 3D model asset
        run: |
          python -m pip install --disable-pip-version-check numpy trimesh
          python tools/build_ommerschans_v8.py

      - name: Build full AR-TijdBeeld APK with standard Android debug signing
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare test APK
        run: |
          mkdir -p dist
          APK_PATH="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          cp "$APK_PATH" dist/AR-TijdBeeld-DefaultSigning.apk
          test -s dist/AR-TijdBeeld-DefaultSigning.apk

      - name: Verify APK signature
        run: |
          apksigner verify --verbose --print-certs dist/AR-TijdBeeld-DefaultSigning.apk
          sha256sum dist/AR-TijdBeeld-DefaultSigning.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: AR-TijdBeeld-DefaultSigning
          path: dist/AR-TijdBeeld-DefaultSigning.apk
          if-no-files-found: error
          retention-days: 14
