name: Android installation test - target SDK 35

on:
  push:
    branches: [ test/minimale-installatie, test/installatie-target35 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build minimal APK with standard Android debug signing
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare installation test APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Installatie-Test-Target35-Target35.apk
          test -s dist/Installatie-Test.apk

      - name: Upload installation test APK
        uses: actions/upload-artifact@v4
        with:
          name: Installatie-Test
          path: dist/Installatie-Test.apk
          if-no-files-found: error
          retention-days: 14
