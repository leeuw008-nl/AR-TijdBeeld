name: Android build

on:
  push:
    branches: [ main, feature/admin-photo-position-editor, feature/geospatial-anchor-prototype, feature/user-admin-modes, feature/ommerschans-photo-georef, fix/ommerschans-topokaart-footprint, fix/persistent-admin-session-and-inner-wall, fix/backup-export-import-from-build-139, release/werkende-versie-alle-6-punten ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tijdbeeld-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore original Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is empty"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::ANDROID_KEYSTORE_PASSWORD is empty"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS is empty"; exit 1; }
          mkdir -p "$RUNNER_TEMP/tijdbeeld-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tijdbeeld-signing/original.keystore"
          test -s "$RUNNER_TEMP/tijdbeeld-signing/original.keystore"
          keytool -list -v \
            -keystore "$RUNNER_TEMP/tijdbeeld-signing/original.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/tijdbeeld-signing/key-info.txt"
          ACTUAL_SHA1="$(awk -F': ' '/SHA1:/{gsub(":","",$2); print tolower($2); exit}' "$RUNNER_TEMP/tijdbeeld-signing/key-info.txt")"
          echo "Persistent signing certificate SHA-1: $ACTUAL_SHA1"
          echo "NOTE: build 231 uses a different temporary certificate; this APK requires a one-time clean reinstall after backing up app data."
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tijdbeeld-signing/original.keystore" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Install and project georeferenced Ommerschans 1895 GLB
        run: |
          mkdir -p app/src/main/assets
          cp diversen/hoofdgebouw_ommerschans_1895.glb app/src/main/assets/ommerschans.glb
          python3 -m pip install --user pillow
          python3 scripts/render_glb_topdown.py \
            diversen/hoofdgebouw_ommerschans_1895.glb \
            app/src/main/assets/ommerschans-topdown.png \
            app/src/main/assets/ommerschans-topdown.json
          test -s app/src/main/assets/ommerschans.glb
          test -s app/src/main/assets/ommerschans-topdown.png
          test -s app/src/main/assets/ommerschans-topdown.json
          cat app/src/main/assets/ommerschans-topdown.json

      - name: Build AR-TijdBeeld APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
        run: |
          test -n "$ARCORE_API_KEY" || { echo "::error::ARCORE_API_KEY secret is empty"; exit 1; }
          gradle --no-daemon :app:assembleDebug

      - name: Prepare AR-TijdBeeld APK
        run: |
          mkdir -p dist
          APK_PATH="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::AR-TijdBeeld APK was not generated."
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          cp "$APK_PATH" dist/AR-TijdBeeld.apk
          test -s dist/AR-TijdBeeld.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs dist/AR-TijdBeeld.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging dist/AR-TijdBeeld.apk | grep -E "package: name='nl.leeuw008.tijdbeeld.diagnose32stable' versionCode='4'|application-label:'AR-TijdBeeld'"

      - name: Final APK integrity check
        run: |
          set -eu
          test -s dist/AR-TijdBeeld.apk
          sha256sum dist/AR-TijdBeeld.apk
          file dist/AR-TijdBeeld.apk

      - name: Upload AR-TijdBeeld APK
        uses: actions/upload-artifact@v4
        with:
          name: AR-TijdBeeld
          path: dist/AR-TijdBeeld.apk
          if-no-files-found: error
          retention-days: 31

