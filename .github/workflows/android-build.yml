name: Android build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tijdbeeld-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore verified #139 signing certificate
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tijdbeeld-diagnostic-signing-key-v1

      - name: Verify original #139 signing certificate
        run: |
          test -s ~/.android/debug.keystore || {
            echo "::error::The original #139 signing key was not restored. Refusing to build."
            exit 1
          }
          ACTUAL_SHA1="$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | awk -F': ' '/SHA1:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA1="2EBB7DA5203326E6C5AA5474C93E0D03F258EA96"
          echo "Signing certificate SHA-1: $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::The signing key is not the original #139 key. No APK will be built or published."
            exit 1
          fi

      - name: Verify ARCore API key secret is configured
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
        run: |
          if [ -z "$ARCORE_API_KEY" ]; then
            echo "::error::GitHub Actions secret ARCORE_API_KEY is missing."
            exit 1
          fi
          echo "ARCore API key secret is present (value is not displayed)."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Prepare Ommerschans assets
        run: |
          mkdir -p app/src/main/assets
          cp diversen/hoofdgebouw_ommerschans_1895.glb app/src/main/assets/ommerschans.glb
          python3 -m pip install --user pillow
          python3 scripts/render_glb_topdown.py \
            diversen/hoofdgebouw_ommerschans_1895.glb \
            app/src/main/assets/ommerschans-topdown.png \
            app/src/main/assets/ommerschans-topdown.json
          test -s app/src/main/assets/ommerschans.glb
          test -s app/src/main/assets/ommerschans-topdown.png
          test -s app/src/main/assets/ommerschans-topdown.json

      - name: Build #139-based APK with ARCore API-key authorization
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify package, signature and ARCore API-key metadata
        run: |
          mkdir -p dist
          APK_PATH="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          cp "$APK_PATH" dist/AR-TijdBeeld.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs dist/AR-TijdBeeld.apk
          "$APKSIGNER" verify --print-certs dist/AR-TijdBeeld.apk | grep -qi "2ebb7da5203326e6c5aa5474c93e0d03f258ea96"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging dist/AR-TijdBeeld.apk | grep -F "package: name='nl.leeuw008.tijdbeeld.diagnose32stable' versionCode='2' versionName='0.1.3'"
          MANIFEST_DUMP="$("$AAPT" dump xmltree dist/AR-TijdBeeld.apk AndroidManifest.xml)"
          echo "$MANIFEST_DUMP" | grep -q "com.google.android.ar.API_KEY"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -v 4 dist/AR-TijdBeeld.apk
          echo "Verified: #139 package, original signing certificate and ARCore API-key manifest entry."

      - name: Install and launch on Android 12 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 32
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-build: 16740729
          emulator-boot-timeout: 900
          script: |
            set -u
            adb logcat -c
            adb install -r dist/AR-TijdBeeld.apk
            adb shell monkey -p nl.leeuw008.tijdbeeld.diagnose32stable 1
            sleep 8
            adb logcat -d -v time > dist/emulator-logcat.txt
            adb shell dumpsys activity activities > dist/emulator-activities.txt
            echo "App process after launch:"
            adb shell pidof nl.leeuw008.tijdbeeld.diagnose32stable || true
            if grep -E "FATAL EXCEPTION|AndroidRuntime.*(FATAL|Process:)|Fatal signal" dist/emulator-logcat.txt; then
              echo "::error::Android reported a fatal app crash. Diagnostic logs are included in the artifact."
              exit 1
            fi
            echo "No fatal Android crash was detected. Emulator process presence is recorded but is not used as a pass/fail condition."

      - name: Upload verified APK and emulator diagnostics
        if: always() && hashFiles('dist/AR-TijdBeeld.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: AR-TijdBeeld-139-API-key-auth
          path: |
            dist/AR-TijdBeeld.apk
            dist/emulator-logcat.txt
            dist/emulator-activities.txt
          if-no-files-found: warn
          retention-days: 31
